<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EduCraft: Media Pembelajaran Interaktif</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"><style>
:root{--bg:#fff;--panel:#EAF0F7;--ink:#1B1B1B;--navy:#1F3A5F;--acc:#F28C28;--on:#14243B;--line:#9DB0C8;--ok:#2E7D32;--no:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A2B;--panel:#1A2A44;--ink:#EEF2F7;--navy:#2D5A94;--line:#4A6585;--ok:#7BD88F;--no:#FF8A80}}
:root[data-theme="dark"]{--bg:#0E1A2B;--panel:#1A2A44;--ink:#EEF2F7;--navy:#2D5A94;--line:#4A6585;--ok:#7BD88F;--no:#FF8A80}
html{scroll-padding-top:env(safe-area-inset-top,0)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Open Sans',system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 14px 48px}
h1,h2,h3{font-family:Poppins,'Segoe UI',sans-serif;margin:0}h1{font-size:26px}h2{font-size:20px;margin:32px 0 6px}h3{font-size:15px;margin:0 0 6px}
.s{margin:4px 0 14px;opacity:.85;max-width:75ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button,.tg{min-height:40px;padding:6px 14px;border-radius:8px;border:2px solid var(--navy);background:var(--bg);color:var(--ink);font:600 14px 'Open Sans',sans-serif;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff}
.sw{overflow-x:auto;border-radius:12px}.stw{container-type:inline-size;min-width:640px}
.st{position:relative;aspect-ratio:16/9;border:2px solid var(--navy);border-radius:12px;overflow:hidden;background:var(--navy);font-size:calc(var(--z,1)*1.4cqw);line-height:1.35;color:var(--ink)}
.bg,.ov{position:absolute;inset:0}.bg{background-size:cover;background-position:center}
.ov{background:linear-gradient(180deg,#1F3A5Fcc,#1F3A5Fe6)}.ov.l{background:#EAF0F7d9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ov.l{background:#0E1A2Bd9}}
.gr{position:absolute;inset:0;display:none;grid-template-columns:repeat(12,1fr);gap:1cqw;padding:0 4cqw;pointer-events:none;z-index:9}.gr i{background:#F28C2833;border-inline:1px dashed #F28C28}.gon .gr{display:grid}
.top{position:absolute;top:0;left:0;right:0;height:5cqw;background:var(--navy);color:#fff;display:flex;align-items:center;gap:1.2cqw;padding:0 2cqw;font-size:1.15cqw;z-index:3}
.top b{font:700 1.7cqw Poppins,sans-serif}.top .pos{flex:1;text-align:center}.top button{background:#ffffff22;color:#fff;border:0;border-radius:.6cqw;padding:.5cqw 1cqw;font:600 1.1cqw 'Open Sans';cursor:pointer}
.prog{position:absolute;top:5cqw;left:0;right:0;height:.5cqw;background:#ffffff40;z-index:3}.prog i{display:block;height:100%;background:var(--acc)}
.stp{position:absolute;top:5.7cqw;left:2cqw;right:2cqw;display:flex;gap:.5cqw;z-index:3}
.stp button{flex:1;padding:.5cqw .2cqw;border-radius:.6cqw;border:.15cqw solid #fff;background:#ffffffcc;color:var(--on);font:600 1cqw 'Open Sans';cursor:pointer}.stp button.on{background:var(--acc);border-color:var(--acc)}
.bot{position:absolute;bottom:0;left:0;right:0;height:5.4cqw;background:var(--bg);display:flex;align-items:center;gap:1cqw;padding:0 2cqw;border-top:.2cqw solid var(--line);z-index:3}.bot .sp{flex:1}
.b{min-height:3.4cqw;padding:0 1.5cqw;border-radius:.8cqw;border:.2cqw solid var(--navy);background:var(--bg);color:var(--ink);font:600 1.25cqw 'Open Sans',sans-serif;cursor:pointer}
.b:hover,.hv{transform:translateY(-.2cqw);outline:.25cqw solid var(--navy)}.b.p{background:var(--acc);border-color:var(--acc);color:var(--on)}.b.d{opacity:.5}
.b small{display:block;font:400 .9cqw 'Open Sans';opacity:.8}
.cd{position:absolute;right:2.5cqw;top:10cqw;bottom:7cqw;width:61cqw;background:var(--bg);border-radius:1.2cqw;padding:1.6cqw;overflow:auto;z-index:2;box-shadow:0 .5cqw 2cqw #0006}
.cd h3{font-size:1.9cqw;margin:0 0 .8cqw}
.ag{position:absolute;left:2.5cqw;bottom:6.2cqw;z-index:2;text-align:center}.ag .fb{height:31cqw;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 .5cqw .7cqw #0008)}
.nm{background:var(--navy);color:#fff;border-radius:.8cqw;padding:.3cqw 1cqw;margin-top:-.6cqw;position:relative;text-align:center;font:600 1.1cqw 'Open Sans'}.nm small{display:block;font-weight:400;font-size:.9cqw}
.bub{position:absolute;left:14cqw;top:11cqw;width:22cqw;background:var(--bg);border:.2cqw solid var(--navy);border-radius:1.2cqw;padding:1cqw 1.2cqw;font-size:1.2cqw;z-index:2}
.bub:before{content:"";position:absolute;left:-1.1cqw;top:3cqw;border:.6cqw solid transparent;border-right-color:var(--navy)}
.bub .av{width:3cqw;height:3cqw;border-radius:50%;object-fit:cover;float:left;margin:0 .8cqw .2cqw 0;border:.2cqw solid var(--acc)}
.sl{position:relative;aspect-ratio:16/9;background:#fff;border:.15cqw solid var(--line);border-radius:.6cqw;overflow:hidden}.sl u{position:absolute;display:block;border-radius:.3cqw;text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw}.opt{border:.25cqw solid var(--line);border-radius:.9cqw;padding:.6cqw;cursor:pointer;background:var(--bg)}.opt.sel{border-color:var(--acc);box-shadow:0 0 0 .25cqw var(--acc)}.opt b{display:block;font-size:1.2cqw;margin-bottom:.3cqw}
.hs{position:absolute;width:2.4cqw;height:2.4cqw;border-radius:50%;background:var(--acc);color:var(--on);font:700 1.2cqw Poppins;border:.2cqw solid #fff;cursor:pointer;z-index:4;display:grid;place-items:center}
.note{background:var(--panel);border-radius:.9cqw;padding:.8cqw 1.1cqw;margin-top:.8cqw;font-size:1.2cqw}.ok{color:var(--ok)}.no{color:var(--no)}
.lumi{border:.2cqw dashed var(--navy);border-radius:1cqw;padding:1.2cqw;position:relative;margin-top:.6cqw}.lumi:before{content:attr(data-t);position:absolute;top:-1.1cqw;left:1.2cqw;background:var(--navy);color:#fff;font:600 .95cqw 'Open Sans';padding:.1cqw .8cqw;border-radius:.5cqw}
.dz{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;margin-top:.8cqw}.dz div{min-height:11cqw;border:.2cqw dashed var(--line);border-radius:.9cqw;padding:.6cqw;cursor:pointer;background:var(--panel)}.dz span,.chp{display:inline-block;margin:.2cqw;padding:.3cqw .8cqw;border-radius:2cqw;background:var(--panel);border:.15cqw solid var(--navy);font-size:1.1cqw;cursor:pointer}.chp.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.mc{position:absolute;left:36cqw;top:12cqw;width:60cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;z-index:2}
.k{background:var(--bg);border-radius:1cqw;padding:1.1cqw 1.3cqw;cursor:pointer;border-left:.9cqw solid var(--acc);position:relative}.k:hover{transform:translateY(-.3cqw);box-shadow:0 .4cqw 1.2cqw #0006}.k b{font:700 1.5cqw Poppins}.k small{display:block;font-size:1.05cqw;opacity:.85}.k em{position:absolute;right:.8cqw;top:.6cqw;font-style:normal;color:var(--ok);font-weight:700}
.dr{position:absolute;top:5.5cqw;right:0;bottom:0;width:26cqw;background:var(--bg);border-left:.3cqw solid var(--acc);padding:1.2cqw;z-index:8;overflow:auto;display:none}.dr.on{display:block}.dr button{display:block;width:100%;text-align:left;margin:.3cqw 0;min-height:0;padding:.6cqw 1cqw;font-size:1.15cqw}
.bx{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--navy);color:#fff}
.sw5{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.sw5 div{border-radius:8px;padding:10px;font-size:13px;border:1px solid var(--line)}
.ag4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.ag4 .card{display:flex;gap:10px;align-items:center}.ag4 img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--acc)}

const D={"seq": ["1.1", "1.2", "1.3", "1.4", "2.1", "2.1.a", "2.1.b", "2.1.c", "2.1.d", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.12.a", "3.12.b", "3.13", "3.13.a", "3.13.b", "3.13.c", "3.13.d", "3.13.e", "3.14", "3.15"], "S": {"1.1": {"t": "Opening", "k": "open", "r": "IP (voice-over): “Selamat datang di EduCraft. Pelatihan ini membantu Anda menerapkan prinsip desain grafis pada media pembelajaran digital yang Anda buat.”", "d": null, "m": 0, "pv": null, "nx": "1.2"}, "1.2": {"t": "Orientasi dan Petunjuk Penggunaan", "k": "ori", "r": "IP: “Multimedia ini menemani pelatihan Anda dan dapat dibuka kembali kapan saja. Anda bebas memilih materi dari menu. Bilah di bagian atas selalu menunjukkan posisi Anda, dan tombol Menu membawa Anda kembali ke pusat navigasi.”", "d": null, "m": 0, "pv": "1.1", "nx": "1.3"}, "1.3": {"t": "Tujuan Pembelajaran", "k": "tuj", "r": "IL: “Setelah mempelajari multimedia ini, Anda diharapkan mampu menguraikan konsep dasar desain grafis, mengidentifikasi penerapan empat prinsip, membedakan desain yang efektif dan kurang efektif, serta memilih unsur desain yang sesuai dengan tujuan pembelajaran.”", "d": null, "m": 0, "pv": "1.2", "nx": "1.4"}, "1.4": {"t": "Brainstorming Awal", "k": "brain", "r": "GP: “Saat menyiapkan slide, saya biasanya memikirkan isi dulu, desainnya belakangan.” GL: “Saya sering ragu memilih warna dan jenis huruf.” IP: “Ketika membuat media pembelajaran digital, aspek desain apa yang biasanya paling Anda pertimbangkan? Pilih satu atau lebih, atau tuliskan sendiri.”", "d": null, "m": 0, "pv": "1.3", "nx": "2.1"}, "2.1": {"t": "Menu Utama", "k": "menu", "r": "IP (voice-over singkat): “Silakan pilih materi. Untuk pemahaman yang utuh, Anda disarankan mempelajari materi secara berurutan, mulai dari Layout & Grid hingga Graphic Elements.”", "d": null, "m": 0, "pv": "1.4", "nx": "3.1"}, "2.1.a": {"t": "Hub Aktivitas", "k": "hubAkt", "r": "IP: “Silakan pilih aktivitas sesuai kebutuhan Anda.”", "d": null, "m": 0, "pv": "2.1", "nx": "2.1"}, "2.1.b": {"t": "Hub Latihan", "k": "hubLat", "r": "IL: “Latihan dapat dikerjakan per materi atau secara integratif.”", "d": null, "m": 0, "pv": "2.1", "nx": "2.1"}, "2.1.c": {"t": "Rangkuman Akhir", "k": "rk", "r": "IP: “Keempat prinsip bekerja bersama untuk mendukung tujuan pembelajaran, karakteristik peserta didik, dan pesan yang ingin Anda sampaikan.”", "d": null, "m": 0, "pv": "2.1", "nx": "2.1"}, "2.1.d": {"t": "Hub Refleksi", "k": "hubRef", "r": "IP: “Silakan pilih refleksi yang ingin Anda tuliskan.”", "d": null, "m": 0, "pv": "2.1", "nx": "2.1"}, "3.1": {"t": "Pembuka Materi 1", "k": "pembuka", "r": "IP: “Selamat datang di Materi 1. Kita akan melihat bagaimana informasi ditata agar mudah diikuti peserta didik.”", "d": null, "m": 1, "pv": "2.1", "nx": "3.2"}, "3.2": {"t": "Pemantik", "k": "pemantik", "r": "IP: “Perhatikan dua slide ini. Menurut Anda, mana yang lebih mudah diikuti informasinya?” GP: “Saya cenderung memilih yang ini, tetapi sulit menjelaskan alasannya.”", "d": null, "m": 1, "pv": "3.1", "nx": "3.3"}, "3.3": {"t": "Konsep dasar desain grafis", "k": "konsep", "r": "IL: “Desain grafis adalah keahlian menyusun unsur visual menjadi informasi yang mudah dipahami. Bagi guru, fungsi terpentingnya adalah menginformasikan: pesan pembelajaran harus sampai kepada peserta didik.”", "d": "ccon", "m": 1, "pv": "3.2", "nx": "3.4"}, "3.4": {"t": "Layout dan unsur tata letak", "k": "konsep", "r": "IL: “Layout menjawab tiga pertanyaan: apa yang dibaca pertama, ke mana mata bergerak berikutnya, dan informasi mana yang saling berkaitan.”", "d": "lay", "m": 1, "pv": "3.3", "nx": "3.5"}, "3.5": {"t": "Grid dan alignment", "k": "konsep", "r": "IL: “Grid adalah kerangka kolom dan baris yang menjadi pedoman penempatan elemen. Dengan grid, elemen pada setiap slide berhenti pada garis yang sama.”", "d": "grid", "m": 1, "pv": "3.4", "nx": "3.6"}, "3.6": {"t": "Spacing dan proximity", "k": "konsep", "r": "IP: “Jarak yang dekat menandakan hubungan. Dekatkan keterangan dengan gambar yang dijelaskan, dan beri jarak lebih lebar antarkelompok.”", "d": "spac", "m": 1, "pv": "3.5", "nx": "3.7"}, "3.7": {"t": "Hierarchy", "k": "konsep", "r": "IL: “Tentukan lebih dulu apa yang paling penting, lalu tampilkan paling menonjol melalui ukuran, ketebalan, atau ruang kosong di sekitarnya.”", "d": "hier", "m": 1, "pv": "3.6", "nx": "3.8"}, "3.8": {"t": "Balance dan konsistensi", "k": "konsep", "r": "IP: “Keseimbangan tidak selalu berarti simetris. Yang penting, bobot visual tidak menumpuk pada satu sisi. Setelah seimbang, ulangi pola yang sama pada setiap slide.”", "d": "bal", "m": 1, "pv": "3.7", "nx": "3.9"}, "3.9": {"t": "Contoh layout efektif", "k": "contohE", "r": "IL: “Perhatikan empat hal pada contoh ini: kesejajaran, jarak antarkelompok, jenjang judul, dan margin yang sama.”", "d": null, "m": 1, "pv": "3.8", "nx": "3.10"}, "3.10": {"t": "Contoh layout kurang efektif", "k": "contohK", "r": "IL: “Isinya sama dengan contoh sebelumnya, tetapi susunannya menyulitkan. Silakan klik tiap titik untuk melihat masalah dan saran perbaikannya.”", "d": null, "m": 1, "pv": "3.9", "nx": "3.11"}, "3.11": {"t": "Rangkuman Materi 1", "k": "rangkum", "r": "IP: “Sebelum masuk ke aktivitas, ingat lima hal ini: sejajarkan, dekatkan yang berkaitan, utamakan yang terpenting, seimbangkan bobot visual, dan ulangi pola yang sama.”", "d": null, "m": 1, "pv": "3.10", "nx": "3.12"}, "3.12": {"t": "Aktivitas: membandingkan dua layout", "k": "aktivitas", "r": "IP: “Silakan pilih slide yang lebih mendukung penyampaian materi kepada siswa, lalu pilih alasan yang sesuai.”", "d": null, "m": 1, "pv": "3.11", "nx": "3.13"}, "3.12.a": {"t": "Feedback: jawaban tepat", "k": "fbA", "r": "IL: “Pilihan Anda tepat. Slide B memiliki alignment dan jarak yang lebih jelas, sehingga informasi mudah diikuti.”", "d": null, "m": 1, "pv": "3.12", "nx": "3.13"}, "3.12.b": {"t": "Feedback: jawaban belum tepat", "k": "fbB", "r": "IL: “Belum tepat. Perhatikan kembali alignment dan jarak antarelemen pada kedua slide.”", "d": null, "m": 1, "pv": "3.12", "nx": "3.13"}, "3.13": {"t": "Latihan", "k": "latihan", "r": "IL: “Silakan kerjakan empat latihan berikut. Anda dapat mengulang soal kapan saja.”", "d": null, "m": 1, "pv": "3.12", "nx": "3.14"}, "3.13.a": {"t": "Soal M1-L1 (Multiple Choice)", "k": "soal", "r": "IL: “Pilih satu jawaban yang paling tepat. Manfaat utama penataan tersebut bagi siswa adalah ...”", "d": null, "m": 1, "pv": "3.13", "nx": "3.13.b"}, "3.13.b": {"t": "Soal M1-L2 (True/False Question)", "k": "soal", "r": "IL: “Tentukan apakah pernyataan berikut benar atau salah. Grid berfungsi sebagai kerangka kolom dan baris untuk menempatkan elemen sehingga elemen pada beberapa slide dapat sejajar dan seragam.”", "d": null, "m": 1, "pv": "3.13", "nx": "3.13.c"}, "3.13.c": {"t": "Soal M1-L3 (Drag and Drop)", "k": "soal", "r": "IL: “Seret setiap ciri ke kotak yang sesuai. Kelompokkan keenam ciri berikut.”", "d": null, "m": 1, "pv": "3.13", "nx": "3.13.d"}, "3.13.d": {"t": "Soal M1-L4 (Multiple Choice)", "k": "soal", "r": "IL: “Pilih perbaikan layout pertama yang paling tepat, lalu tulis satu kalimat alasan. Perbaikan layout apa yang akan Anda lakukan lebih dulu?”", "d": null, "m": 1, "pv": "3.13", "nx": "3.13.e"}, "3.13.e": {"t": "Hasil latihan", "k": "hasil", "r": "IL: “Anda telah menyelesaikan latihan. Soal yang belum tepat dapat diulang kapan saja.”", "d": null, "m": 1, "pv": "3.13", "nx": "3.14"}, "3.14": {"t": "Refleksi", "k": "refleksi", "r": "GL: “Saya baru menyadari slide saya tidak memiliki jenjang yang jelas.” IP: “Prinsip layout apa yang paling relevan untuk media pembelajaran yang biasa Anda gunakan?”", "d": null, "m": 1, "pv": "3.13", "nx": "3.15"}, "3.15": {"t": "Kembali ke menu", "k": "kembali", "r": "IP: “Kita telah membahas layout dan grid. Silakan lanjut ke Materi 2: Color & Color Palette, atau kembali ke menu.”", "d": null, "m": 1, "pv": "3.14", "nx": "4.1"}}, "JM": {"3.3": {"sub": "Konsep dasar desain grafis", "p": ["Desain grafis adalah keahlian menyusun dan merancang unsur visual, yaitu huruf, gambar atau foto, elemen grafis, dan warna, menjadi informasi yang mudah dipahami khalayak (Kemnaker, 2020). Desain grafis termasuk seni terapan: selain indah, ia harus berfungsi menjawab persoalan komunikasi.", "Buku informasi Kemnaker (2020) menyebut tiga fungsi desain grafis, yaitu menginformasikan (to inform), mengidentifikasi (to identify), dan membujuk (to persuade). Fungsi menginformasikan paling dekat dengan pekerjaan Anda: slide, lembar kerja, dan poster kelas adalah sarana menyampaikan pesan pembelajaran. Karena itu, ukuran desain yang baik bukan sekadar “enak dipandang”, melainkan “pesannya sampai”.", "Kuba (2021) menegaskan bahwa visual pada materi digital bukan lagi tambahan, melainkan faktor penting dalam menyampaikan makna, dan materi yang dirancang dengan prinsip desain dapat membantu pemahaman serta mengurangi kesan sulit. Empat prinsip yang Anda pelajari di EduCraft (Layout & Grid, Color & Color Palette, Typography, Graphic Elements) adalah perangkat untuk mencapai hal itu."]}, "3.4": {"sub": "Layout dan unsur tata letak", "p": ["Layout (tata letak) adalah penataan unsur visual pada satu bidang tampilan agar pesan terbaca dalam urutan yang jelas. Unsur yang ditata mencakup garis, bidang, ilustrasi, tipografi, warna, gelap-terang, tekstur, dan ruang (Kuswantoro, 2019).", "Dua unsur langsung memengaruhi penataan slide. Garis berguna membagi ruang dan mengarahkan pandangan, misalnya garis tipis sebagai pemisah judul dan isi. Ruang kosong dimanfaatkan agar rancangan tidak terlalu penuh dan sebagai pemisah antarkelompok informasi (Kemnaker, 2020).", "Dalam media pembelajaran, layout menjawab tiga pertanyaan: apa yang dibaca pertama, ke mana mata bergerak berikutnya, dan informasi mana yang saling berkaitan. Contoh: pada slide IPA tentang wujud zat, judul ditempatkan di kiri atas, penjelasan dalam tiga poin pada kolom kiri, dan diagram pada kolom kanan. Urutan baca (judul, poin, diagram) langsung terlihat."]}, "3.5": {"sub": "Grid dan alignment", "p": ["Grid adalah himpunan garis vertikal dan horizontal yang menjadi kerangka penataan elemen (Samara, 2017, dalam Kuba, 2021). Untuk bahan ajar, grid modular paling mudah dipakai. Grid modular terdiri atas margin (area di sekeliling konten), kolom (pembagi vertikal), baris atau garis dasar (pembagi horizontal), dan gutter (jarak antarkolom).", "Alignment (kesejajaran) berarti menempatkan elemen pada garis yang sama sehingga tercipta kesan teratur. Cara termudah mencapainya adalah menggunakan grid (Kuba, 2021). Sebagai pedoman praktis, gunakan rata kiri untuk paragraf karena setiap baris dimulai pada garis yang sama, dan rata tengah hanya untuk judul pendek.", "Contoh: pada grid 12 kolom, judul menempati kolom 1 sampai 12, tiga poin menempati kolom 1 sampai 6, dan diagram menempati kolom 8 sampai 12; semuanya berhenti pada margin yang sama. Kesalahan umum: elemen yang “hampir sejajar” dengan selisih beberapa piksel, sehingga tampak kurang rapi."]}, "3.6": {"sub": "Spacing dan proximity", "p": ["Proximity (kedekatan) menyatakan bahwa elemen yang berdekatan dipersepsikan berhubungan, sedangkan elemen yang berjauhan dipersepsikan tidak berhubungan (Kuba, 2021). Gunakan jarak sebagai bahasa visual: jarak kecil di dalam satu kelompok, jarak lebih besar antarkelompok.", "Kuba (2021), merujuk Mayer (2017), menyampaikan bahwa peserta didik belajar lebih baik ketika kata dan gambar yang saling berkaitan diletakkan berdekatan. Contohnya, keterangan diletakkan tepat di samping bagian gambar yang dijelaskan, bukan di bagian bawah layar.", "Ruang kosong (white space) bukan ruang terbuang. Ia memberi ruang bernapas, memisahkan kelompok, dan membuat unsur penting menonjol (Kemnaker, 2020; Kuba, 2021). Kesalahan umum: memenuhi seluruh slide demi “efisiensi”, atau memberi jarak sama rata pada semua elemen sehingga hubungan antarinformasi tidak terbaca. Perbaikan: kelompokkan terlebih dahulu, lalu beri jarak lebih lebar antarkelompok."]}, "3.7": {"sub": "Hierarchy", "p": ["Hierarchy (hierarki visual) adalah pengurutan tingkat kepentingan informasi sehingga peserta didik tahu apa yang dilihat lebih dulu. Menurut Kuba (2021), hierarki dapat dibentuk melalui ketebalan huruf, ukuran, penggunaan huruf kapital pada judul utama, ruang kosong di sekitar unsur penting, warna, dan bentuk kecil di dekat kalimat kunci.", "Judul memakai ukuran terbesar dan paling tebal, subjudul berukuran sedang, dan isi paling sederhana. Pembedaan ukuran membantu peserta didik memahami struktur materi dan membangun skema konseptual (Kuba, 2021). Kemnaker (2020) menambahkan bahwa mata cenderung bergerak dari area gelap ke terang dan dari area kompleks ke area sederhana; manfaatkan kecenderungan ini untuk menuntun pandangan.", "Contoh: kalimat kunci “Cuaca berbeda dari iklim” dicetak tebal di dalam kotak abu muda, sedangkan penjelasannya memakai huruf biasa. Hierarki tipografi dibahas lebih rinci pada Materi 3."]}, "3.8": {"sub": "Balance dan konsistensi", "p": ["Balance (keseimbangan) berarti bobot visual terbagi serasi sehingga komposisi terasa mantap. Kemnaker (2020) membaginya menjadi keseimbangan formal atau simetris (dua sisi pada sumbu khayal tampak berbobot sama) dan informal atau asimetris (bobot berbeda tetapi tetap seimbang). Slide dengan teks padat di kiri dan ruang kosong di kanan terasa “miring”; menambahkan diagram di kanan memperbaikinya.", "Unity (kesatuan) adalah keserasian seluruh unsur sehingga membentuk kesan utuh (Kemnaker, 2020). Dalam praktik kelas, kesatuan dicapai lewat konsistensi atau pengulangan (repetition): posisi judul, margin, warna aksen, dan gaya ikon yang sama di setiap slide membantu peserta didik cepat mengenali struktur materi (Kuba, 2021).", "Kuba (2021) menyarankan menyiapkan layout khusus untuk tujuan pembelajaran, isi, dan butir ringkasan, lalu memakainya berulang. Gunakan master slide agar konsistensi terjaga tanpa kerja ulang."]}, "3.9": {"sub": "Contoh layout efektif dan kurang efektif", "p": ["Bandingkan dua slide berisi sama, yaitu topik “Struktur teks prosedur”. Pada slide kurang efektif, sembilan baris paragraf rata tengah memenuhi layar, judul kecil dan posisinya berbeda dari slide lain, gambar kecil berada di pojok tanpa kaitan dengan teks, dan jarak antarelemen tidak teratur.", "Pada slide efektif, judul di kiri atas berukuran terbesar; tiga poin singkat rata kiri berada pada satu kolom dengan jarak sama; diagram langkah di kolom kanan tepat di samping poin yang relevan; margin sama di semua sisi; ruang kosong cukup.", "Perbedaannya bukan pada isi, melainkan pada penataan. Gunakan daftar periksa: (1) Apakah elemen sejajar? (2) Apakah yang berkaitan berdekatan? (3) Apakah ada satu hal yang jelas paling penting? (4) Apakah bobot visual seimbang? (5) Apakah polanya sama dengan slide lain?"]}, "3.10": {"sub": "Contoh layout efektif dan kurang efektif", "p": ["Bandingkan dua slide berisi sama, yaitu topik “Struktur teks prosedur”. Pada slide kurang efektif, sembilan baris paragraf rata tengah memenuhi layar, judul kecil dan posisinya berbeda dari slide lain, gambar kecil berada di pojok tanpa kaitan dengan teks, dan jarak antarelemen tidak teratur.", "Pada slide efektif, judul di kiri atas berukuran terbesar; tiga poin singkat rata kiri berada pada satu kolom dengan jarak sama; diagram langkah di kolom kanan tepat di samping poin yang relevan; margin sama di semua sisi; ruang kosong cukup.", "Perbedaannya bukan pada isi, melainkan pada penataan. Gunakan daftar periksa: (1) Apakah elemen sejajar? (2) Apakah yang berkaitan berdekatan? (3) Apakah ada satu hal yang jelas paling penting? (4) Apakah bobot visual seimbang? (5) Apakah polanya sama dengan slide lain?"]}, "3.11": {"sub": "Rangkuman Materi 1", "p": ["Layout adalah cara Anda menata teks, gambar, dan ruang kosong agar mata peserta didik bergerak dalam urutan yang jelas. Grid menjadi kerangka yang membuat penataan itu rapi dan seragam. Ingat lima hal: (1) sejajarkan elemen pada garis yang sama (alignment); (2) dekatkan yang berkaitan dan jauhkan yang berbeda, sisakan ruang kosong (proximity); (3) tentukan hal terpenting lalu buat paling menonjol (hierarchy); (4) jaga bobot visual tetap seimbang (balance); (5) ulangi pola yang sama di setiap slide (konsistensi)."]}}, "RK": {"1": "Layout adalah cara Anda menata teks, gambar, dan ruang kosong agar mata peserta didik bergerak dalam urutan yang jelas. Grid menjadi kerangka yang membuat penataan itu rapi dan seragam. Ingat lima hal: (1) sejajarkan elemen pada garis yang sama (alignment); (2) dekatkan yang berkaitan dan jauhkan yang berbeda, sisakan ruang kosong (proximity); (3) tentukan hal terpenting lalu buat paling menonjol (hierarchy); (4) jaga bobot visual tetap seimbang (balance); (5) ulangi pola yang sama di setiap slide (konsistensi).", "2": "Warna adalah alat komunikasi: menarik perhatian, mengelompokkan, dan membedakan informasi. Batasi color palette menjadi satu warna dominan, satu pendukung, satu aksen, dan warna netral. Pastikan teks terbaca: rasio kontras teks dan latar minimal 4,5:1 untuk teks biasa. Pakai warna yang sama untuk makna yang sama, dan jangan mengandalkan warna saja untuk membedakan informasi; tambahkan label atau ikon.", "3": "Tipografi adalah pengaturan huruf agar teks nyaman dibaca. Pilih huruf yang jelas (sans serif umumnya aman untuk layar), batasi maksimal dua jenis huruf, dan bedakan tingkat informasi lewat ukuran serta ketebalan (hierarchy). Atur jarak baris dan panjang baris, rata kiri untuk paragraf, dan gunakan gaya yang sama di seluruh media. Jika teks terlalu panjang, ringkas isinya; jangan mengecilkan huruf.", "4": "Elemen grafis (ikon, shape, garis, ilustrasi, gambar, tekstur, dan elemen dekoratif) harus hadir karena punya fungsi. Ujilah setiap elemen dengan tiga pertanyaan: apakah membantu peserta didik memahami isi, apakah gayanya sama dengan elemen lain, dan apakah jumlahnya masih proporsional. Gunakan satu gaya yang seragam, jumlah secukupnya, dan sisakan ruang kosong. Hindari elemen yang hanya mengisi ruang."}, "SOAL": {"M1-A": {"kode": "M1-A", "tipe": "Aktivitas. Lumi: Question Set (Soal 1 Multiple Choice pilihan tunggal; Soal 2 Multiple Choice jawaban ganda)", "ind": "1.3", "stimulus": "Dua slide IPA kelas VII bertopik “Wujud zat”, isi teksnya sama. Slide A: judul kecil di tengah atas, paragraf sembilan baris rata tengah, tiga gambar wujud zat berukuran berbeda tersebar tanpa sejajar. Slide B: judul besar di kiri atas, tiga poin singkat rata kiri pada kolom kiri dengan jarak seragam, satu diagram tiga wujud zat pada kolom kanan, margin sama di semua sisi.", "instruksi": "Perhatikan kedua slide, lalu jawab dua pertanyaan.", "tanya": "Soal 1: Slide mana yang lebih mudah diikuti siswa SMP? Soal 2: Pilih semua alasan yang mendukung pilihan Anda.", "isi": ["Soal 1. A. Slide A  B. Slide B  C. Keduanya sama mudahnya  D. Tidak dapat ditentukan tanpa mengetahui isi slide", "Soal 2 (jawaban ganda). a. Teks sejajar pada satu kolom  b. Jarak antarpoin sama dan terpisah dari diagram  c. Judul tampil paling menonjol  d. Teksnya lengkap sehingga siswa tidak perlu bertanya  e. Gambar dibuat lebih kecil agar tidak mengganggu teks"], "kunci": "Soal 1: B. Soal 2: a, b, c.", "fb": "Tepat. Slide B memiliki alignment, jarak, dan hierarchy yang lebih jelas sehingga urutan baca mudah diikuti dan informasi utama terpisah dari pendukung.", "fs": "Belum tepat. Bandingkan kembali: apakah elemen pada kedua slide sejajar, apakah yang berkaitan berdekatan, dan apakah ada satu hal yang jelas paling penting? Buka kembali scene Alignment dan Hierarchy."}, "M1-L1": {"kode": "M1-L1", "tipe": "Lumi: Multiple Choice (pilihan tunggal)", "ind": "1.1", "stimulus": "Seorang guru menata slide dengan judul di kiri atas, tiga poin singkat rata kiri, dan satu gambar di kanan.", "instruksi": "Pilih satu jawaban yang paling tepat.", "tanya": "Manfaat utama penataan tersebut bagi siswa adalah ...", "isi": hub(s){const K=s.k,m1={hubAkt:['3.12',actSc()],hubLat:['3.13',latSc()],hubRef:['3.14',ST.ref['M1-ref']?'Sudah diisi':'Belum diisi']}[K];let b;

 return bg('lap','l')+chrome(s)+agent(s)+card(b)},

pemantik(s){return bg('bgA','l')+chrome(s)+agent(s)+card(`<h3>Perhatikan dua slide ini. Mana yang lebih mudah diikuti informasinya?</h3>${two(slide('A'),slide('B'),'Slide A','Slide B')}<div class="two" style="margin-top:.5cqw"><div class="opt ${ST.pick=='A'?'sel':''}" data-a="p:A"><b>Pilih Slide A</b></div><div class="opt ${ST.pick=='B'?'sel':''}" data-a="p:B"><b>Pilih Slide B</b></div></div><textarea class="ta" data-i="3.2" placeholder="Alasan singkat (maks. 140 karakter, opsional)" maxlength="140">${ST.ref['3.2']||''}</textarea><div class="note">${ST.pick?'Pilihan Anda dicatat dan tidak dinilai. Kita periksa alasannya pada scene berikut.':'Pilih A atau B terlebih dahulu.'}</div>`)},
konsep(s){const j=D.JM[s.id],P=j?j.p:[qt(s.r)],i=Math.min(ST.kc[s.id]||0,P.length-1);const dg=s.d&&DG[s.d]?(s.d=='grid'?`<div class="sl" style="position:relative">${slide('B').replace('<div class="sl">','').replace(/<\/div>$/,'')}${ST.gr?gridov:''}</div>`:DG[s.d](s)):'';
 return bg('bgA','l')+chrome(s)+agent(s)+card(`<h3>${j?j.sub:s.t}</h3><div style="display:grid;grid-template-columns:${dg?'1.15fr 1fr':'1fr'};gap:1.2cqw"><div><div class="note" style="margin:0"><b>Kartu ${i+1} dari ${P.length}</b></div><p style="margin:.6cqw 0">${P[i]}</p><p>${i>0?`<span class="b" data-a="kp:${s.id}">Sebelumnya</span> `:''}${i<P.length-1?`<span class="b p" data-a="kn:${s.id}">Berikutnya</span>`:''}${s.d=='grid'?` <span class="b" data-a="gt">${ST.gr?'Sembunyikan':'Tampilkan'} grid</span>`:''}</p></div>${dg?`<div>${dg}</div>`:''}</div>`)},
contoh(s){const E=s.k=='contohE',j=D.JM[s.id],P=j?(E?j.p.slice(1):j.p.slice(0,2)):[],H=E?HE:HK;return bg('bgA','l')+chrome(s)+agent(s)+card(`<h3>${E?'Contoh layout efektif':'Contoh layout kurang efektif'}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw"><div><div style="position:relative">${slide(E?'B':'A')}${hsb(E?[[8,24],[8,44],[60,12],[88,70]]:[[8,30],[44,8],[78,64],[88,90]],'h',0,E?'':'#B3261E')}</div><div class="note">${ST.hs!=null?H[ST.hs]:'Klik titik bernomor untuk melihat penjelasannya.'}</div></div><div>${P.map(p=>`<p style="margin:0 0 .5cqw;font-size:1.15cqw">${p}</p>`).join('')}</div></div>`)},

hasil(s){const C=['M1-A','M1-L1','M1-L2','M1-L3','M1-L4'],mx=[2,1,1,6,1],ob=C.reduce((a,c)=>a+((ST.ans[c]||{}).pts||0),0),R=D.RUB[0].rows,ru=R.reduce((a,r)=>a+(+ST.rub[r[0]]||0),0),tot=ob+ru,pc=Math.round(tot/23*100);

let tm;
